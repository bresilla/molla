name: rust

# CI matrix:
#   - build-test:           cargo fmt + clippy (-D warnings, all
#                           features/targets) + build + cargo test
#                           (default lane; the operator-invoked
#                           `#[ignore]`d GPU/perf tests are excluded —
#                           they need a wgpu adapter which GitHub
#                           Actions ubuntu-latest doesn't expose) +
#                           the no-default-features (CPU-only) build
#                           and test lane.
#   - ignored-tests:        cargo test --workspace -- --ignored. Most
#                           ignored tests panic without a GPU; this job
#                           is allowed to fail (`continue-on-error`)
#                           because the goal is *visibility* — a silently
#                           skipped test is the bug we're guarding
#                           against. When the project gets a GPU runner,
#                           drop `continue-on-error` and let CI gate on
#                           it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The hosted runner's linker OOMs (ld bus error) on the full-debuginfo
  # Bevy viewer binary; line-tables keep backtraces useful at a fraction
  # of the link memory. CI-only — local builds keep full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Bevy Linux runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Same lint gate as `make harden`. The workspace reached zero
      # clippy warnings on 2026-07-02 (INSPECTION.md T1a) — keep it
      # there. Lint-policy allows live in [workspace.lints.clippy].
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      # CPU-only lane: `gpu` off must keep compiling and passing for
      # headless consumers (also part of `make harden`).
      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features

      - name: cargo test (no default features)
        run: cargo test --workspace --no-default-features

  ignored-tests:
    # Run the `#[ignore]`-gated suite (GPU + wall-clock perf tests). On
    # a CPU-only runner the GPU tests will panic — that's the *intent*:
    # a missing GPU adapter must be loud, not silent. Marked
    # `continue-on-error: true` so a CPU-only runner can't gate merges
    # on tests it physically can't run; promote to a hard gate once a
    # GPU-equipped runner is wired in.
    #
    # Failure-bucket guide for log triage:
    #   1. `Engine::new_gpu()` panic                 → expected on
    #      CPU-only runner; the panic message is the *intent*.
    #   2. Wall-clock perf-gate failures (LBVH 10k,
    #      MPM 50k+64³, etc.) under contended runs   → typically
    #      `--test-threads` contention; perf gates document this with
    #      a hint to re-run single-threaded.
    #   3. SIGSEGV / kernel panic                    → real GPU bug
    #      surfaced by the parallel run; investigate.
    # (The Newton oracle is pure ported Rust — no Python/venv is
    # involved; see book/src/testing/strategy.md.)
    name: ignored tests (GPU/perf — visibility only)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bevy Linux runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: cargo test --ignored
        # `--ignored` runs *only* the gated tests (no overlap with
        # build-test above). Failures here surface tests that the GPU
        # path has silently bit-rotted, not just an absent adapter.
        # `--no-fail-fast` keeps the run going past the first failed
        # crate so the log surfaces *every* failing test, not just the
        # first one that panicked.
        run: cargo test --workspace --no-fail-fast -- --ignored
