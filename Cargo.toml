[workspace]
resolver = "2"
members = [
    "crates/molla-core",
    "crates/molla-math",
    "crates/molla-storage",
    "crates/molla-compute",
    "crates/molla-sim",
    "crates/molla-optim",
    "crates/molla-actuators",
    "crates/molla-kernels",
    "crates/molla-sensors",
    "crates/molla-geometry",
    "crates/molla-solvers",
    "crates/molla-autograd",
    "crates/molla-fem",
    "crates/molla-compute-primitives",
    "crates/molla",
    "bin/molla_viewer",
]
exclude = ["xtra"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bresilla/molla"
authors = ["Trim Bresilla"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
