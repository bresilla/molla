[package]
name = "molla-sim"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Raw simulation model, state, controls, contacts, and builders for molla."

[lints]
workspace = true

[features]
default = []
gpu = ["dep:wgpu", "molla-storage/gpu"]

[dependencies]
molla-core = { path = "../molla-core", default-features = false }
molla-math = { path = "../molla-math" }
molla-storage = { path = "../molla-storage", default-features = false }
bytemuck = { version = "1.18", features = ["derive"] }
slotmap = "1"
wgpu = { version = "29", optional = true, default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "std",
] }
