[package]
name = "molla-autograd"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CPU autograd and adjoint utilities for molla."

[lints]
workspace = true

[dependencies]
molla-math = { path = "../molla-math" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
molla-optim = { path = "../molla-optim" }

[[bench]]
name = "bench_autograd_featherstone"
harness = false

[[bench]]
name = "bench_autograd_tape"
harness = false

[[bench]]
name = "bench_mpm_diff"
harness = false
