[package]
name = "molla-geometry"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Geometry and collision primitives for molla."

[lints]
workspace = true

[features]
default = []
gpu = [
    "dep:molla-compute-primitives",
    "dep:molla-compute",
    "dep:wgpu",
    "molla-compute-primitives/gpu",
    "molla-compute/gpu",
    "molla-core/gpu",
    "molla-sim/gpu",
    "molla-storage/gpu",
]

[dependencies]
molla-compute-primitives = { path = "../molla-compute-primitives", default-features = false, optional = true }
molla-compute = { path = "../molla-compute", default-features = false, optional = true }
molla-core = { path = "../molla-core", default-features = false }
molla-math = { path = "../molla-math" }
molla-sim = { path = "../molla-sim", default-features = false }
molla-storage = { path = "../molla-storage", default-features = false }
bytemuck = { version = "1.18", features = ["derive"] }
rayon = "1.10"
parry3d-f64 = { version = "=0.26.1", default-features = false, features = ["required-features", "std", "alloc", "enhanced-determinism"] }
wgpu = { version = "27", optional = true, default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "std",
] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
molla-compute = { path = "../molla-compute", default-features = false, features = ["gpu"] }

[[bench]]
name = "bench_sparse_grid_insert"
harness = false

[[bench]]
name = "bench_sparse_grid_query"
harness = false

[[bench]]
name = "bench_contact_reduction"
harness = false

[[bench]]
name = "bench_mpr_vs_gjk"
harness = false

[[bench]]
name = "bench_narrow_phase_pairs"
harness = false

[[bench]]
name = "bench_lbvh_build"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_lbvh_refit"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_broadphase_pairs"
harness = false
required-features = ["gpu"]
