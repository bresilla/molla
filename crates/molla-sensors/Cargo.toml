[package]
name = "molla-sensors"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sensor models and sensor adjoints for molla."

[lints]
workspace = true

[features]
default = []
gpu = [
    "dep:arrayvec",
    "dep:bytemuck",
    "dep:wgpu",
    "dep:molla-geometry",
    "molla-compute/gpu",
    "molla-core/gpu",
    "molla-geometry/gpu",
    "molla-kernels/gpu",
    "molla-sim/gpu",
    "molla-storage/gpu",
]
# wgpu internal object counters for the resource-retention regression.
resource-counters = ["gpu", "wgpu/counters"]

[dependencies]
arrayvec = { version = "0.7.6", optional = true }
bytemuck = { version = "1.18", features = ["derive"], optional = true }
molla-compute = { path = "../molla-compute", default-features = false, optional = true }
molla-core = { path = "../molla-core", default-features = false }
# H1 — TriMesh raycasts use molla-geometry's mesh BVH on the GPU.
molla-geometry = { path = "../molla-geometry", default-features = false, optional = true }
molla-kernels = { path = "../molla-kernels", default-features = false, optional = true }
molla-math = { path = "../molla-math" }
molla-sim = { path = "../molla-sim", default-features = false, optional = true }
molla-storage = { path = "../molla-storage", default-features = false, optional = true }
wgpu = { version = "29", optional = true, default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "std",
] }

[dev-dependencies]
pollster = "0.4"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
molla-geometry = { path = "../molla-geometry", default-features = false }

[[bench]]
name = "bench_camera_latency"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_latency"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_camera"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_raycast"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_scene_refit"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_scene_queries"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_lidar"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_images"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_cloud"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_grid"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_annotations"
harness = false
required-features = ["gpu"]

[[bench]]
name = "bench_sensor_cloud_export"
harness = false
required-features = ["gpu"]

[[test]]
name = "sensor_resource_retention_gpu"
required-features = ["resource-counters"]
