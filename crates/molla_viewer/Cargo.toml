[package]
name = "molla_viewer"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bevy-based interactive viewer for molla physics scenes."

[lints]
workspace = true

[dependencies]
# We disable `molla/gpu` so Bevy is the only crate pulling `wgpu` into the
# viewer binary. Stage-1 stepping is CPU-only anyway; we can re-enable the
# GPU path once we align wgpu versions with Bevy in stage 2.
molla = { path = "../molla", default-features = false }

bevy = { version = "0.18", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_picking",
    "bevy_scene",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "tonemapping_luts",
    "smaa_luts",
    "default_font",
    "zstd_rust",
    "ktx2",
    "x11",
    "wayland",
    "reflect_auto_register",
] }

# egui shell — frost styles it; glacial reads pane rects from it for
# input-firewall purposes.
bevy_egui = { version = "0.39", default-features = false, features = [
    "default_fonts",
    "render",
] }

# Glass-themed editor UI kit (themed egui via FrostPlugin).
bevy_frost = { git = "https://github.com/bresilla/bevy_frost", branch = "develop", package = "bevy_frost" }

# Orbit camera + grid + gizmos.
bevy_glacial = { git = "https://github.com/bresilla/bevy_glacial", branch = "main" }

[[bin]]
name = "molla_viewer"
path = "src/main.rs"
