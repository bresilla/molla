[package]
name = "molla_viewer"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bevy-based interactive viewer for molla physics scenes."

[lints]
workspace = true

[dependencies]
# molla's `gpu` feature is on. molla and Bevy share wgpu 27, so the
# viewer can step on either CPU or GPU based on the user's UI toggle.
molla = { path = "../molla" }

# Microsoft's mimalloc — drop-in global allocator. egui's tessellator
# thrashes the system allocator, and frost's NOTES say mimalloc cuts
# frame time from ~120 ms to ~13 ms in the heavy demo. Worth the dep.
mimalloc = { version = "0.1", default-features = false }

bevy = { version = "0.18", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_picking",
    "bevy_scene",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "tonemapping_luts",
    "smaa_luts",
    "default_font",
    "zstd_rust",
    "ktx2",
    "x11",
    "wayland",
    "reflect_auto_register",
] }

# egui shell — frost styles it; glacial reads pane rects from it for
# input-firewall purposes.
bevy_egui = { version = "0.39", default-features = false, features = [
    "default_fonts",
    "render",
] }

# Glass-themed editor UI kit (themed egui via FrostPlugin).
bevy_frost = { git = "https://github.com/bresilla/bevy_frost", branch = "develop", package = "bevy_frost" }

# Orbit camera + grid + gizmos.
bevy_glacial = { git = "https://github.com/bresilla/bevy_glacial", branch = "main" }

[[bin]]
name = "molla_viewer"
path = "src/main.rs"
