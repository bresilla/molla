[package]
name = "molla"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "molla — pure-Rust, wgpu-accelerated physics engine."

[lints]
workspace = true

[features]
default = ["gpu"]
# Enable the wgpu GPU backend. The CPU paths and math/storage layers compile
# without it, which is useful for pure-CPU CI runners and for users that only
# want the data model.
gpu = [
    "dep:wgpu",
    "dep:pollster",
    "molla-core/gpu",
    "molla-storage/gpu",
    "molla-compute/gpu",
    "molla-compute-primitives/gpu",
    "molla-sim/gpu",
    "molla-actuators/gpu",
    "molla-kernels/gpu",
    "molla-geometry/gpu",
    "molla-sensors/gpu",
    "molla-solvers/gpu",
    "molla-fem/gpu",
]
# Stage 36.7 — direct sparse linear solver (`fem::DirectSolver`,
# `fem::solve_steady_state_direct`). Off by default. Enabled via
# `cargo build -p molla --features russell`. The original Stage 36.7
# spec called for the upstream `russell_sparse` crate; that crate
# requires SuiteSparse + LAPACKE native libraries with hard-coded
# include paths (`/usr/include/suitesparse`) that aren't available in
# molla's nix-flake devShell, so the feature presently ships a pure-
# Rust dense LU implementation under the same flag. See
# `crate::fem::russell` for the swap-out story.
russell = ["molla-fem/russell"]

[dependencies]
molla-core = { path = "../molla-core", default-features = false }
molla-math = { path = "../molla-math" }
molla-storage = { path = "../molla-storage", default-features = false }
molla-compute = { path = "../molla-compute", default-features = false }
molla-compute-primitives = { path = "../molla-compute-primitives", default-features = false }
molla-sim = { path = "../molla-sim", default-features = false }
molla-optim = { path = "../molla-optim" }
molla-actuators = { path = "../molla-actuators" }
molla-kernels = { path = "../molla-kernels", default-features = false }
molla-sensors = { path = "../molla-sensors", default-features = false }
molla-geometry = { path = "../molla-geometry", default-features = false }
molla-solvers = { path = "../molla-solvers", default-features = false, features = ["autograd"] }
molla-autograd = { path = "../molla-autograd" }
molla-fem = { path = "../molla-fem", default-features = false }
molla-vehicle = { path = "../molla-vehicle" }
glam = { version = "0.30", features = ["bytemuck"] }
tracing = "0.1"
slotmap = "1"
bytemuck = { version = "1.18", features = ["derive"] }
# Stage 21.1 — data-parallel mesh-utility tools (decimate / SDF bake).
# Used only inside `crate::geometry` authoring code; not on the per-frame
# hot path. Added in this stage so QEM cost evaluation and per-voxel
# closest-point passes can fan out across cores deterministically.
rayon = "1.10"

# Optional GPU stack (gated behind `gpu` feature). Pinned to match the
# wgpu version Bevy 0.18 ships so molla + Bevy can share one wgpu in
# the viewer binary. We pull every desktop backend (Vulkan / Metal /
# DX12 / GL) plus WebGPU so the same build works wherever wgpu does.
wgpu = { version = "27", optional = true, default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "std",
] }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
# Stage 24c — CPU oracle for the GPU FFT kernel. Test-only; never
# pulled into the runtime crate.
rustfft = "6"

[[bench]]
name = "step_cpu"
harness = false

[[bench]]
name = "step_gpu"
harness = false
required-features = ["gpu"]

