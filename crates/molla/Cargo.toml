[package]
name = "molla"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "molla — pure-Rust, wgpu-accelerated physics engine."

[lints]
workspace = true

[features]
default = ["gpu"]
# Enable the wgpu GPU backend. The CPU paths and math/storage layers compile
# without it, which is useful for pure-CPU CI runners and for users that only
# want the data model and importers.
gpu = ["dep:wgpu", "dep:pollster"]
# Enable the MuJoCo wrapper solver (`SolverMuJoCo`). Off by default because
# it requires the upstream MuJoCo C library to be system-installed (the
# `mujoco-rust` build script looks for `libmujoco` at `~/.local/mujoco` or
# in the standard system search paths). With the feature off, `mujoco.rs`
# compiles to an empty module so users without MuJoCo can still build the
# rest of the project. When the feature is on but `libmujoco` is missing
# at link time, the build fails with a clear linker error from
# `mujoco-rust`. See PLAN.md Stage 22 for scope notes.
mujoco = ["dep:mujoco-rust"]

[dependencies]
glam = { version = "0.30", features = ["bytemuck"] }
thiserror = "2"
tracing = "0.1"
slotmap = "1"
bytemuck = { version = "1.18", features = ["derive"] }
urdf-rs = "0.9"
# Stage 36.6 — Gmsh MSH 4.1 parser. Pure-Rust, no heavy deps; reads
# both ASCII and binary MSH files. Used only by `fem::FemMesh::from_gmsh*`
# constructors so `cargo check` without FEM scenes still drops the
# transitive deps in dead-code elim.
mshio = "0.4"
# Stage 21.1 — data-parallel mesh-utility tools (decimate / SDF bake).
# Used only inside `crate::geometry` authoring code; not on the per-frame
# hot path. Added in this stage so QEM cost evaluation and per-voxel
# closest-point passes can fan out across cores deterministically.
rayon = "1.10"

# Optional GPU stack (gated behind `gpu` feature). Pinned to match the
# wgpu version Bevy 0.18 ships so molla + Bevy can share one wgpu in
# the viewer binary. We pull every desktop backend (Vulkan / Metal /
# DX12 / GL) plus WebGPU so the same build works wherever wgpu does.
wgpu = { version = "27", optional = true, default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "std",
] }
pollster = { version = "0.4", optional = true }

# Optional MuJoCo wrapper. Pinned to a known-good 0.0.x release; the
# upstream API surface is small and stable enough that this isn't risky.
# `default-features = false` skips the optional `mj-render` feature
# which would pull in OpenGL deps molla doesn't need (we render via
# Bevy in the viewer crate instead).
mujoco-rust = { version = "0.0.6", optional = true, default-features = false }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
# Stage 24c — CPU oracle for the GPU FFT kernel. Test-only; never
# pulled into the runtime crate.
rustfft = "6"

[[bench]]
name = "step_cpu"
harness = false

[[bench]]
name = "step_gpu"
harness = false
required-features = ["gpu"]

